name: consultancy_admin
description: "SB Consultants — Enterprise Admin Dashboard (Flutter Web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend & Auth
  supabase_flutter: ^2.12.0

  # State Management & Functional
  flutter_riverpod: ^3.2.1
  fpdart: ^1.2.0
  equatable: ^2.0.7

  # Routing & Deep Linking for Web
  go_router: ^17.1.0

  # Typography & Design
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  file_picker: ^10.3.10
  flutter_dotenv: ^6.0.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  test_api: 0.7.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
